name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8
      - name: Unit tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (for the cluster smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: enterprise-ai-assistant:ci
          outputs: type=docker,dest=/tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  k8s-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - uses: helm/kind-action@v1
      - name: Load image and deploy to kind
        run: |
          docker load -i /tmp/image.tar
          kind load docker-image enterprise-ai-assistant:ci
          kubectl apply -f k8s/00-namespace.yaml -f k8s/10-config.yaml -f k8s/20-pvc.yaml -f k8s/40-service.yaml
          sed 's#enterprise-ai-assistant:latest#enterprise-ai-assistant:ci#' k8s/30-deployment.yaml | kubectl apply -f -
          kubectl -n kb-assistant rollout status deploy/kb-assistant --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n kb-assistant port-forward svc/kb-assistant 8080:80 &
          sleep 5
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/ready
          curl -fsS localhost:8080/metrics | grep -q http_requests_total || true
      - name: Debug on failure
        if: failure()
        run: kubectl -n kb-assistant describe pods; kubectl -n kb-assistant logs deploy/kb-assistant

  deploy:
    # Real deployment: add a base64 kubeconfig as the repo secret KUBE_CONFIG. Skipped otherwise.
    needs: k8s-smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then echo "KUBE_CONFIG not set - skipping deploy"; exit 0; fi
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -f k8s/00-namespace.yaml -f k8s/10-config.yaml -f k8s/20-pvc.yaml -f k8s/40-service.yaml
          sed "s#enterprise-ai-assistant:latest#${IMAGE}:${GITHUB_SHA}#" k8s/30-deployment.yaml | kubectl apply -f -
          kubectl -n kb-assistant rollout status deploy/kb-assistant --timeout=180s
