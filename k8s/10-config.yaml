apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-assistant-config
  namespace: kb-assistant
data:
  LOG_LEVEL: "INFO"
  DATA_DIR: "/data"
  EMBEDDING_BACKEND: "tfidf"
  MAX_UPLOAD_MB: "20"
  # Optional: any OpenAI-compatible endpoint
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
---
apiVersion: v1
kind: Secret
metadata:
  name: kb-assistant-secret
  namespace: kb-assistant
type: Opaque
stringData:
  # Leave empty to use the extractive (no-LLM) mode.
  # Better: kubectl -n kb-assistant create secret generic kb-assistant-secret --from-literal=LLM_API_KEY=xxx
  LLM_API_KEY: ""
