# helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring -f this-file
grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
